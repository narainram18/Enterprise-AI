spring.datasource.url=${TEST_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/enterprise_ai}}
spring.datasource.username=${TEST_DB_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${TEST_DB_PASSWORD:${DB_PASSWORD:2005}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

jwt.secret=${TEST_JWT_SECRET:${JWT_SECRET:test-only-enterprise-ai-secret-key-2026}}
