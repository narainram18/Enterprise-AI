spring.application.name=backend
server.port=8080
spring.jpa.open-in-view=false
spring.profiles.default=dev

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing schema baseline

jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ai.ollama.model=${OLLAMA_MODEL:qwen3.5:4b-q4_K_M}
ai.chat.max-context-messages=${AI_CHAT_MAX_CONTEXT_MESSAGES:20}
ai.chat.stream-timeout=${AI_CHAT_STREAM_TIMEOUT:300000}
document.storage.location=${DOCUMENT_STORAGE_LOCATION:./data/documents}
document.upload.max-size=${DOCUMENT_UPLOAD_MAX_SIZE:10485760}
spring.servlet.multipart.max-file-size=${DOCUMENT_UPLOAD_MAX_SIZE:10485760}
spring.servlet.multipart.max-request-size=${DOCUMENT_UPLOAD_MAX_SIZE:10485760}
document.chunking.chunk-size=${DOCUMENT_CHUNK_SIZE:500}
document.chunking.chunk-overlap=${DOCUMENT_CHUNK_OVERLAP:100}

ai.embedding.provider=${AI_EMBEDDING_PROVIDER:ollama}
ai.embedding.batch-size=${AI_EMBEDDING_BATCH_SIZE:32}
ai.embedding.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ai.embedding.ollama.model=${OLLAMA_EMBEDDING_MODEL:qwen3-embedding:0.6b}

ai.vector.provider=${AI_VECTOR_PROVIDER:qdrant}
ai.vector.qdrant.host=${QDRANT_HOST:localhost}
ai.vector.qdrant.port=${QDRANT_PORT:6334}
ai.vector.qdrant.collection=${QDRANT_COLLECTION:document_chunks}
ai.vector.qdrant.api-key=${QDRANT_API_KEY:}

ai.retrieval.enabled=${AI_RETRIEVAL_ENABLED:true}
ai.retrieval.top-k=${AI_RETRIEVAL_TOP_K:10}
ai.retrieval.minimum-similarity-score=${AI_RETRIEVAL_MINIMUM_SCORE:0.10}
ai.retrieval.maximum-retrieved-chunks=${AI_RETRIEVAL_MAX_CHUNKS:5}
ai.retrieval.maximum-retrieved-documents=${AI_RETRIEVAL_MAX_DOCUMENTS:5}
ai.retrieval.maximum-retrieved-characters=${AI_RETRIEVAL_MAX_CHARACTERS:12000}
ai.retrieval.search-timeout=${AI_RETRIEVAL_SEARCH_TIMEOUT:5000}
