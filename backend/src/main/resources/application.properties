spring.application.name=backend
server.port=8080
spring.jpa.open-in-view=false
spring.profiles.default=dev

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing schema baseline

jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ai.ollama.model=${OLLAMA_MODEL:qwen3.5:4b-q4_K_M}
ai.chat.max-context-messages=${AI_CHAT_MAX_CONTEXT_MESSAGES:20}
ai.chat.stream-timeout=${AI_CHAT_STREAM_TIMEOUT:120000}
