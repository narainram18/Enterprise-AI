spring.application.name=backend

server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/enterprise_ai}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:2005}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
jwt.secret=${JWT_SECRET:EnterpriseAIWorkspaceSecretKey2026SpringBootJWTAuthentication123456}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
